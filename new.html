<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiclo - 10 Min Delivery Karnal</title>
    <style>
        :root { --primary: #ff3269; --secondary: #25d366; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; margin: 0; padding: 15px; }
        .header { text-align: center; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .header h1 { color: var(--primary); margin: 0; font-size: 28px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 18px; padding: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #eee; transition: 0.3s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 110px; object-fit: contain; border-radius: 10px; margin-bottom: 10px; }
        .card h3 { font-size: 14px; margin: 8px 0; height: 35px; overflow: hidden; color: #333; }
        .price { color: #000; font-weight: bold; font-size: 16px; margin: 5px 0; }
        .add-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .add-btn:active { transform: scale(0.95); }
        .whatsapp-float { position: fixed; bottom: 20px; right: 20px; background: var(--secondary); color: white; padding: 15px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="header">
    <h1>🚀 Quiclo</h1>
    <p>Delivery in 10 Mins • Karnal</p>
</div>

<div class="grid" id="product-grid"></div>

<script>
    // 50 Items Power List - Mapping as per your screenshot
    const products = [
        { id: 1, name: "Aashirvaad Atta", price: 245, img: "aashirvaad.jpg" },
        { id: 2, name: "Agarbatti", price: 50, img: "agarbatti.jpg" },
        { id: 3, name: "Amul Butter", price: 56, img: "butter.jpg" },
        { id: 4, name: "Amul Lassi", price: 20, img: "lassi.png" },
        { id: 5, name: "Amul Milk", price: 33, img: "milk.jpeg" },
        { id: 11, name: "Bisleri 1L", price: 20, img: "bisleri.jpeg" },
        { id: 23, name: "Aloo Bhujia", price: 40, img: "aloo_bhujia.png" },
        { id: 36, name: "Parle-G", price: 10, img: "parle_g.png" },
        { id: 42, name: "Real Juice 1L", price: 110, img: "real_juice.png" },
        { id: 48, name: "Surf Excel 1kg", price: 135, img: "surf_excel.png" }
        // ... Baaki items tum idhar add kar sakte ho upar ke pattern mein
    ];

    const grid = document.getElementById('product-grid');

    products.forEach(p => {
        grid.innerHTML += `
            <div class="card">
                <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150?text=${p.name}'">
                <h3>${p.name}</h3>
                <p class="price">₹${p.price}</p>
                <button class="add-btn" onclick="order('${p.name}')">ADD</button>
            </div>
        `;
    });

    function order(name) {
        const phone = "91XXXXXXXXXX"; // Apna WhatsApp number yahan daalo
        const msg = encodeURIComponent(`Hi Quiclo! I want to order ${name}.`);
        window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    }
</script>

</body>
</html>
